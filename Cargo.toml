[package]
name = "pom-plugin-code-server"
version = "0.1.0"
license = "MIT"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }

[[test]]
name = "contract"
path = "tests/contract.rs"
